name: market-intelligence-os

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Execution mode"
        required: false
        default: sample
        type: choice
        options:
          - sample
          - live
      phase:
        description: "Optional phase override"
        required: false
        default: all
        type: choice
        options:
          - all
          - ingest
          - score

jobs:
  schema-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python scripts/bootstrap_audit.py

  type-check:
    runs-on: ubuntu-latest
    needs: schema-and-audit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python scripts/type_check.py

  tests-and-sample:
    runs-on: ubuntu-latest
    needs: [schema-and-audit, type-check]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python scripts/smoke_test.py
      - run: python scripts/run_phase.py --mode "${{ inputs.mode }}" --phase "${{ inputs.phase }}"
      - run: pytest -q
