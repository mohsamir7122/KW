name: market-intelligence-os

on:
  schedule:
    - cron: "20 3 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Execution mode"
        required: false
        default: sample
        type: choice
        options:
          - sample
          - live
      phase:
        description: "Optional phase override"
        required: false
        default: all
        type: choice
        options:
          - all
          - ingest
          - score
          - phase3
          - phase4
          - phase5
          - phase6
          - phase7
          - phase8
          - phase9

env:
  # Force JavaScript-based actions onto Node 24 to proactively validate
  # compatibility ahead of GitHub's Node 20 deprecation window.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  schema-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python scripts/bootstrap_audit.py

  type-check:
    runs-on: ubuntu-latest
    needs: schema-and-audit
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python scripts/type_check.py

  tests-and-sample:
    runs-on: ubuntu-latest
    needs: [schema-and-audit, type-check]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python scripts/smoke_test.py
      - run: |
          MODE="${{ github.event.inputs.mode || 'sample' }}"
          PHASE="${{ github.event.inputs.phase || 'all' }}"
          python scripts/run_phase.py --mode "${MODE}" --phase "${PHASE}"
      - run: pytest -q
      - name: Upload runtime and daily export artifacts
        uses: actions/upload-artifact@v6
        with:
          name: kw-mi-os-artifacts-${{ github.run_id }}
          path: |
            runtime/latest
            runtime/quality
            reports
          if-no-files-found: warn
